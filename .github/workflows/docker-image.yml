name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 编译 open62541 + ctest，耗时较长
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -t tsnhub .
    - name: '导出并上传镜像工件'
      run: |
        docker save tsnhub | gzip > tsnhub-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'tsnhub-docker-image-${{ github.ref_name }}'
        path: 'tsnhub-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14